# WorkBuddy Manager single-container deployment.
# workbuddy2api is compiled into the same image and runs as a supervised child process.
services:
  workbuddy-manager:
    build:
      context: .
      args:
        # Optional mirrors for networks where the official package indexes are slow.
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Leave empty to generate and persist a random key on first boot.
      WB2API_KEY: ${WB2API_KEY:-}
      WB2API_BASE: http://127.0.0.1:7863
      WB2API_PID_FILE: /tmp/workbuddy2api.pid
      WB2API_LOG_FILE: /app/data/workbuddy2api.log
      WB_UPSTREAM_RUNTIME_DIR: /var/lib/workbuddy2api
      WB_AUTH_DIR: /var/lib/workbuddy2api/auths
      WB_UPSTREAM_CONFIG: /var/lib/workbuddy2api/config.json
      WB_UPSTREAM_DATA_DIR: /var/lib/workbuddy2api/data
      WB_TRUST_PROXY: "1"
      WB_ENABLE_DOCS: "0"
    ports:
      # Keep both APIs behind a reverse proxy by default.
      - "127.0.0.1:7863:7863"
      - "127.0.0.1:7864:7864"
    volumes:
      # Docker-managed volumes: no host project directory is mounted at runtime.
      - workbuddy-manager-data:/app/data
      - workbuddy-upstream-data:/var/lib/workbuddy2api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7864/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  workbuddy-manager-data:
  workbuddy-upstream-data:
