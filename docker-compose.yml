# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   1) docker compose up -d --build
#   3) 浏览器打开 http://<服务器IP>:7864
#      首次启动若未设 WB_ADMIN_PASSWORD，会随机生成密码并打印到容器日志：
#      docker compose logs workbuddy-manager | grep -A2 密码
#
# workbuddy2api 源码已包含在 workbuddy2api-master/，不需要另行 clone。

services:
  # 首次启动才复制示例配置并生成随机上游密钥；已有配置和账号绝不覆盖。
  workbuddy2api-init:
    image: python:3.12-alpine
    user: "0:0"
    working_dir: /upstream
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ ! -f config.json ]; then
          cp config.example.json config.json;
          WB2API_KEY="$${WB2API_KEY:-$$(python3 -c 'import secrets; print(secrets.token_hex(32))')}" python3 -c
          "import json, os; p='config.json'; c=json.load(open(p)); c['api_key']=os.environ['WB2API_KEY']; json.dump(c, open(p, 'w'), ensure_ascii=False, indent=2)";
        fi;
        mkdir -p auths data;
        chown -R 10001:10001 auths data config.json
    environment:
      # 可在 .env 中设置固定值；留空时首启自动生成随机值。
      WB2API_KEY: ${WB2API_KEY:-}
    volumes:
      - ./workbuddy2api-master:/upstream

  workbuddy2api:
    build:
      context: ./workbuddy2api-master
    image: workbuddy2api:bundled
    container_name: workbuddy2api
    restart: unless-stopped
    depends_on:
      workbuddy2api-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      # 显式值优先；空值时使用首启生成到 config.json 的密钥。
      WB2A_API_KEY: ${WB2API_KEY:-}
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./workbuddy2api-master/auths:/app/auths
      - ./workbuddy2api-master/data:/app/data
      - ./workbuddy2api-master/config.json:/app/config.json:ro

  workbuddy-manager:
    build:
      context: .
      # 可选：Debian 软件源镜像。
      #
      # 官方源（deb.debian.org）走 Fastly CDN，中国大陆访问实测**频繁 502 且极慢**
      # （约 367 kB/s，常在下载某个 .deb 时中断），构建会在第 2 步 "apt-get update"
      # 直接失败——表现就是镜像建不出来、容器起不来、页面 ERR_CONNECTION_REFUSED。
      #
      # Dockerfile 里已内置一次自动降级（官方源失败自动改阿里云重试），所以多数情况
      # 不配也能建成功，只是会先白等一轮。想完全避免等待就把下面两行取消注释，
      # 或临时用命令行覆盖：
      #   docker compose build --build-arg DEBIAN_MIRROR=mirrors.aliyun.com
      #
      # 可选镜像：mirrors.aliyun.com / mirrors.tuna.tsinghua.edu.cn / mirrors.ustc.edu.cn
      args:
        DEBIAN_MIRROR: ""
        # 可选：PyPI 镜像（成因同上——官方源走国际 CDN，国内会抖动/失败）。
        # 留空 = 官方源，失败时 Dockerfile 会自动降级到清华镜像重试。
        # 可选镜像：https://pypi.tuna.tsinghua.edu.cn/simple / https://mirrors.aliyun.com/pypi/simple
        PIP_INDEX_URL: ""
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    # 这个 restart 策略是容器版「一键更新」能生效的前提：
    # 更新完成后容器内的进程会退出，靠它用新代码重新拉起。
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 首启管理员密码；不设则随机生成并打印到日志（推荐首启后立即改）
      # WB_ADMIN_PASSWORD: "改成你的强密码"
      # 内置上游走 Compose 内部网络，不依赖宿主机端口或外部目录。
      WB2API_BASE: http://workbuddy2api:7863
      WB2API_KEY: ${WB2API_KEY:-}
      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
    ports:
      # **只监听本机**：管理端必须藏在反向代理之后。
      # 若确需直接从别的机器访问，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制——
      # 管理端持有全部账号凭据，直接暴露到公网是被打穿的常见原因。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据库、日志、更新状态、上游版本固定标记都在这里。
      # 必须持久化，否则重建容器会丢失统计与审计记录。
      - ./data:/app/data
      # 仓库内置的上游目录。一次挂载覆盖下面三件事（分开挂子路径会互相重叠，
      # 反而让权限语义变模糊）：
      #   · 读/写上游 config.json —— 管理端「设置」页保存的目标
      #   · 读/写 auths/ —— 扫码添加账号会落盘 workbuddy-<uid>.json（见
      #     tencent.write_auth_file），所以**不能只读**
      #   · 读上游 docker-compose.yml 做端口收敛；「更新上游」时在容器内
      #     git fetch/pull 并重建上游容器
      #
      # **权限提示（与上游 issue #108 同款问题）**：bind mount 的目录属主由宿主机
      # 决定，镜像内的 chown 不起作用。若管理端显示「0 个账号」而 auths 里明明有
      # 文件，或添加账号报权限错误，通常是跨 uid 读写不到——宿主机执行一次：
      #   chown -R 10001:10001 workbuddy2api-master/auths
      # （10001 是上游容器内进程的 uid，管理端也用同一 uid，见 Dockerfile）
      #
      # 若你**不想**让管理端碰上游仓库（例如上游由别人维护），改成只挂 config.json
      # 与 auths/ 两条子路径即可：此时「更新上游」会不可用，界面会如实提示。
      - ./workbuddy2api-master:/opt/workbuddy2api
      # docker 控制套接字：挂上后容器内的管理端可以像宿主部署那样操作上游容器
      # （保存设置后自动重载 / 读上游日志 / 一键更新上游）。
      #
      # **安全性说明（值得读）**：挂 docker.sock 等于把宿主 root 权限交给本容器。
      # 但这**不是新增的风险等级**——宿主部署时本服务本来就是 root 运行
      # （systemd 单元无 User=、安装脚本要求 root），而 root 进程本来就能
      # `docker run -v /:/host` 拿到宿主文件系统。两者权限等价。
      #
      # 若你的要求是最小权限，把下面这行注释掉即可：此时依赖 docker 的功能会
      # 自动降级为「请到宿主机执行 docker compose ...」，界面如实提示，不会
      # 静默失败。
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      workbuddy2api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7864/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
